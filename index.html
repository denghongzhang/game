<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>三消乐 · 最新版</title>
<style>
  body{margin:0;min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:space-evenly;
    font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;color:#ffe9c4;
    background:radial-gradient(120% 80% at 50% 0%,#4a1f14,#1c0b07 70%);}
  h1{font-size:clamp(26px,9vw,40px);letter-spacing:3px;margin:0;text-shadow:0 2px 10px rgba(0,0,0,.6);}
  p.tip{font-size:12.5px;opacity:.85;margin:0;}
  a.card{display:flex;align-items:center;gap:14px;width:min(86vw,340px);padding:18px 20px;border-radius:18px;
    text-decoration:none;color:#ffe9c4;font-size:19px;font-weight:700;letter-spacing:2px;
    background:linear-gradient(160deg,rgba(255,214,128,.16),rgba(0,0,0,.25));
    border:1.5px solid rgba(255,214,128,.55);box-shadow:0 6px 18px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.18);}
  a.card span.em{font-size:30px;}
  /* R19：微信内引导浮层（与游戏页同款风格） */
  #wx-hint{position:fixed;inset:0;z-index:200;background:rgba(20,8,4,.72);display:flex;align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(2px);}
  #wx-hint .wx-card{background:linear-gradient(180deg,#2a1410,#1c0d09);border:1px solid rgba(255,215,0,.35);border-radius:18px;max-width:340px;width:100%;padding:24px 20px;text-align:center;box-shadow:0 12px 40px rgba(0,0,0,.5);}
  #wx-hint .wx-ico{font-size:40px;}
  #wx-hint .wx-title{font-size:20px;font-weight:900;color:#ffe27a;margin:8px 0 6px;}
  #wx-hint .wx-sub{font-size:14px;color:#e9dcc8;line-height:1.7;}
  #wx-hint .wx-sub b{color:#ffd9a0;}
  #wx-hint .wx-actions{display:flex;gap:10px;margin-top:16px;}
  #wx-hint .wx-btn{flex:1;min-height:48px;border-radius:12px;border:none;font-size:15px;font-weight:800;cursor:pointer;background:linear-gradient(180deg,#ffe27a,#ff9b2e);color:#3a1500;}
  #wx-hint .wx-btn.ghost{background:rgba(255,255,255,.1);color:#ffe9a8;border:1px solid rgba(255,215,0,.4);}
</style>
</head>
<body>
  <h1>三消乐 · 最新版</h1>
  <p class="tip">R19 完整版 · 稳定入口（微信内若被拦截请复制到浏览器打开）</p>
  <a class="card" href="xyxx-wechat.html"><span class="em">🐒</span>西游三消乐</a>
  <a class="card" href="hlgc-wechat.html"><span class="em">🏮</span>红楼三消乐</a>
  <p class="tip">© 2026 三消乐 · 稳定入口</p>
  <!-- R19：微信内打开提示（仅微信 UA 出现） -->
  <script>
  (function(){
    var ua = (navigator.userAgent || '').toLowerCase();
    if(!/micromessenger/.test(ua)) return;
    var d = document.createElement('div');
    d.id = 'wx-hint';
    d.innerHTML = '<div class="wx-card">'
      + '<div class="wx-ico">🎮</div>'
      + '<div class="wx-title">微信内可直接游玩</div>'
      + '<div class="wx-sub">点下方卡片进入游戏。若遇讲读无声或画面异常：<br>点右上角 <b>···</b> → <b>在浏览器打开</b> 体验更佳。<br><br>📲 浏览器打开后，可「分享 → 添加到主屏幕」，<b>断网也能玩</b>、讲读离线可听。</div>'
      + '<div class="wx-actions">'
      +   '<button class="wx-btn ghost" id="wx-copy">📋 复制链接</button>'
      +   '<button class="wx-btn" id="wx-stay">继续在微信玩 ▶</button>'
      + '</div></div>';
    document.body.appendChild(d);
    var copy = d.querySelector('#wx-copy');
    if(copy) copy.onclick = function(){
      var url = location.href;
      if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(url).then(function(){ copy.textContent='✅ 已复制'; }); }
      else { var t=document.createElement('textarea'); t.value=url; document.body.appendChild(t); t.select(); try{document.execCommand('copy'); copy.textContent='✅ 已复制';}catch(e){} t.remove(); }
    };
    var stay = d.querySelector('#wx-stay');
    if(stay) stay.onclick = function(){ d.parentNode.removeChild(d); };
  })();
  </script>
</body>
</html>
